<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Habit Tracker</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Habits">
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#000000',
                            cardLight: '#ffffff',
                            cardDark: '#1c1c1e',
                            subtleDark: '#2c2c2e',
                            accent: '#0a84ff',
                            green: '#30d158',
                            purple: '#bf5af2',
                            orange: '#ff9f0a',
                            red: '#ff453a'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
        .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }

        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, minmax(0, 1fr));
            grid-auto-flow: column;
            gap: 3px;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
        }

        .check-btn:active {
            transform: scale(0.88);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black text-gray-900 dark:text-gray-100 h-full flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="safe-top bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-200 dark:border-neutral-800 px-4 py-3 flex items-center justify-between transition-colors">
        <div>
            <span id="header-date" class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-neutral-400">Today</span>
            <h1 id="header-title" class="text-2xl font-bold tracking-tight">Daily Habits</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="theme-toggle" class="p-2.5 rounded-full bg-gray-100 dark:bg-neutral-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-neutral-700 transition" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                <i class="fa-solid fa-sun hidden dark:block text-lg text-amber-400"></i>
            </button>
            <button onclick="openHabitModal()" class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-md shadow-blue-500/20 active:scale-95 transition">
                <i class="fa-solid fa-plus text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto px-4 py-4 max-w-2xl mx-auto w-full pb-24">
        
        <!-- View 1: Habits Today & Weekly -->
        <section id="tab-today" class="tab-content active space-y-4">
            <!-- Progress Bar Card -->
            <div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-gray-600 dark:text-neutral-400">Habit Progress</span>
                    <span id="today-percentage" class="text-sm font-bold text-blue-600 dark:text-blue-400">0%</span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-neutral-800 rounded-full h-3 overflow-hidden">
                    <div id="today-progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
                <p id="today-stats-text" class="text-xs text-gray-500 dark:text-neutral-500 mt-2 text-right">0 habits completed</p>
            </div>

            <!-- Categories / Filter Pills -->
            <div id="category-filter-bar" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-sm">
                <button onclick="filterCategory('All')" class="cat-filter-btn px-3.5 py-1.5 rounded-full bg-blue-600 text-white font-medium whitespace-nowrap transition" data-cat="All">All</button>
            </div>

            <!-- Habits List -->
            <div id="today-habits-list" class="space-y-3">
                <!-- Dynamic Habit Items inserted here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12 px-4">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-100 dark:bg-neutral-800 flex items-center justify-center text-gray-400 dark:text-neutral-500 text-2xl">
                    <i class="fa-solid fa-square-check"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 dark:text-neutral-200">No Habits Found</h3>
                <p class="text-sm text-gray-500 dark:text-neutral-400 max-w-xs mx-auto mt-1">Tap the '+' button above to start tracking your habits!</p>
            </div>
        </section>

        <!-- View 2: Analytics & Heatmap -->
        <section id="tab-analytics" class="tab-content space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white dark:bg-neutral-900 p-4 rounded-2xl border border-gray-200 dark:border-neutral-800 shadow-sm">
                    <span class="text-xs font-semibold text-gray-500 dark:text-neutral-400 uppercase tracking-wide">Clean Streak</span>
                    <div class="flex items-baseline space-x-1 mt-1">
                        <span id="stat-current-streak" class="text-3xl font-extrabold text-amber-500">0</span>
                        <span class="text-xs text-gray-500">days/weeks</span>
                    </div>
                </div>
                <div class="bg-white dark:bg-neutral-900 p-4 rounded-2xl border border-gray-200 dark:border-neutral-800 shadow-sm">
                    <span class="text-xs font-semibold text-gray-500 dark:text-neutral-400 uppercase tracking-wide">30-Day Success</span>
                    <div class="flex items-baseline space-x-1 mt-1">
                        <span id="stat-monthly-rate" class="text-3xl font-extrabold text-emerald-500">0%</span>
                    </div>
                </div>
            </div>

            <!-- Heatmap -->
            <div class="bg-white dark:bg-neutral-900 p-4 rounded-2xl border border-gray-200 dark:border-neutral-800 shadow-sm overflow-hidden">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-base flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-blue-500"></i> Consistency Grid
                    </h3>
                    <span class="text-xs text-gray-400">Tap a square to zoom in</span>
                </div>
                <div class="overflow-x-auto pb-2">
                    <div id="heatmap-grid-container" class="heatmap-grid min-w-max"></div>
                </div>
            </div>
        </section>

        <!-- View 3: Manage Habits -->
        <section id="tab-manage" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base">All Habits (<span id="manage-count">0</span>)</h3>
                <button onclick="openHabitModal()" class="text-xs text-blue-600 dark:text-blue-400 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Create New
                </button>
            </div>
            <div id="manage-habits-list" class="space-y-3"></div>
        </section>

        <!-- View 4: Settings -->
        <section id="tab-settings" class="tab-content space-y-4">
            <div class="bg-white dark:bg-neutral-900 rounded-2xl border border-gray-200 dark:border-neutral-800 p-4 shadow-sm space-y-3">
                <h3 class="font-bold text-base">Data & Privacy</h3>
                <button onclick="exportDataJSON()" class="w-full py-3 px-4 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 font-semibold text-sm flex items-center justify-between">
                    <span><i class="fa-solid fa-download mr-2"></i> Export Backup (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="safe-bottom fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-neutral-900/90 backdrop-blur-lg border-t border-gray-200 dark:border-neutral-800 z-30 transition-colors">
        <div class="max-w-2xl mx-auto flex justify-around items-center h-14">
            <button onclick="switchTab('today')" id="nav-today" class="nav-btn flex-1 flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 font-medium">
                <i class="fa-solid fa-calendar-check text-lg"></i>
                <span class="text-[10px] mt-0.5">Habits</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 font-medium">
                <i class="fa-solid fa-chart-simple text-lg"></i>
                <span class="text-[10px] mt-0.5">Stats</span>
            </button>
            <button onclick="switchTab('manage')" id="nav-manage" class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 font-medium">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-[10px] mt-0.5">Manage</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 font-medium">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px] mt-0.5">Settings</span>
            </button>
        </div>
    </nav>

    <!-- Habit Modal -->
    <div id="habit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-neutral-900 w-full max-w-lg rounded-2xl p-5 shadow-2xl border border-gray-200 dark:border-neutral-800">
            <div class="flex justify-between items-center pb-3 border-b border-gray-100 dark:border-neutral-800">
                <h2 id="modal-title" class="text-lg font-bold">New Habit</h2>
                <button onclick="closeHabitModal()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-neutral-800 text-gray-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="habit-form" onsubmit="handleHabitSubmit(event)" class="space-y-4 mt-4">
                <input type="hidden" id="habit-id">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Habit Name</label>
                    <input type="text" id="habit-name" placeholder="e.g. Yoga, Exercise" required class="w-full px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Frequency</label>
                        <select id="habit-freq" onchange="toggleQuotaInput()" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 text-sm">
                            <option value="daily">Daily Target</option>
                            <option value="weekly">Weekly Quota</option>
                        </select>
                    </div>
                    <div id="quota-container" class="hidden">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Weekly Quota</label>
                        <input type="number" id="habit-quota" min="1" max="7" value="2" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 text-sm">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold">Save Habit</button>
            </form>
        </div>
    </div>

    <!-- Date Zoom-In Modal -->
    <div id="date-zoom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-neutral-900 w-full max-w-md rounded-2xl p-5 shadow-2xl border border-gray-200 dark:border-neutral-800">
            <h3 id="date-zoom-title" class="font-bold text-lg mb-2">Details for Date</h3>
            <div id="date-zoom-content" class="space-y-2 text-sm text-gray-600 dark:text-neutral-300 my-4"></div>
            <button onclick="closeDateZoomModal()" class="w-full py-2.5 rounded-xl bg-gray-100 dark:bg-neutral-800 font-semibold text-xs">Close</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'habit_tracker_weekly_quota_v1';
        let state = { habits: [], logs: {}, settings: { theme: 'dark' }, activeFilter: 'All', activeTab: 'today' };

        function getTodayString(d = new Date()) {
            return d.toISOString().split('T')[0];
        }

        function getStartOfWeek(dateObj = new Date()) {
            const d = new Date(dateObj);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Monday start
            return new Date(d.setDate(diff)).toISOString().split('T')[0];
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            setupTheme();
            renderApp();
        });

        function loadFromStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try { state = JSON.parse(data); } catch (e) { console.error(e); }
            } else {
                state.habits = [
                    { id: 'h1', name: 'Yoga', freq: 'weekly', quota: 2, category: 'Fitness', color: '#0a84ff' },
                    { id: 'h2', name: 'Read Book', freq: 'daily', quota: 1, category: 'Learning', color: '#30d158' }
                ];
                saveToStorage();
            }
        }

        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

        function setupTheme() {
            if (state.settings.theme === 'dark') document.documentElement.classList.add('dark');
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderApp();
        }

        function toggleQuotaInput() {
            const freq = document.getElementById('habit-freq').value;
            document.getElementById('quota-container').classList.toggle('hidden', freq !== 'weekly');
        }

        function renderApp() {
            if (state.activeTab === 'today') renderTodayTab();
            if (state.activeTab === 'analytics') renderAnalyticsTab();
            if (state.activeTab === 'manage') renderManageTab();
        }

        function renderTodayTab() {
            const habitsListEl = document.getElementById('today-habits-list');
            habitsListEl.innerHTML = state.habits.map(habit => {
                const todayStr = getTodayString();
                const selectedDate = document.getElementById(`date-select-${habit.id}`)?.value || todayStr;
                const isCheckedOnSelected = state.logs[selectedDate] && state.logs[selectedDate][habit.id]?.completed;

                let progressText = '';
                let progressPct = 0;

                if (habit.freq === 'weekly') {
                    const startOfWeek = getStartOfWeek(new Date(selectedDate));
                    let completedThisWeek = 0;
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(startOfWeek);
                        d.setDate(d.getDate() + i);
                        const dStr = getTodayString(d);
                        if (state.logs[dStr] && state.logs[dStr][habit.id]?.completed) {
                            completedThisWeek++;
                        }
                    }
                    progressText = `${completedThisWeek} of ${habit.quota} complete this week`;
                    progressPct = Math.min(100, Math.round((completedThisWeek / habit.quota) * 100));
                }

                return `
                    <div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-2xl p-4 shadow-sm space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-base">${habit.name}</h4>
                                <span class="text-xs text-gray-500">${habit.freq === 'weekly' ? `${habit.quota}x / week quota` : 'Daily Target'}</span>
                            </div>
                            <input type="date" id="date-select-${habit.id}" value="${selectedDate}" onchange="renderTodayTab()" class="text-xs p-1 rounded bg-gray-100 dark:bg-neutral-800 text-gray-700 dark:text-neutral-300 border border-gray-200 dark:border-neutral-700">
                        </div>

                        ${habit.freq === 'weekly' ? `
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span>Weekly Progress</span>
                                    <span>${progressText}</span>
                                </div>
                                <div class="w-full bg-gray-100 dark:bg-neutral-800 rounded-full h-2 overflow-hidden">
                                    <div class="bg-blue-600 h-2 rounded-full" style="width: ${progressPct}%"></div>
                                </div>
                            </div>
                        ` : ''}

                        <div class="flex justify-end pt-1">
                            <button onclick="toggleCheckIn('${habit.id}', document.getElementById('date-select-${habit.id}').value)" class="check-btn px-4 py-2 rounded-xl text-xs font-semibold ${isCheckedOnSelected ? 'bg-emerald-500 text-white' : 'bg-gray-100 dark:bg-neutral-800 text-gray-600 dark:text-neutral-300'}">
                                ${isCheckedOnSelected ? '✓ Completed' : '+ Log Check-In'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCheckIn(habitId, dateStr) {
            if (!state.logs[dateStr]) state.logs[dateStr] = {};
            const current = state.logs[dateStr][habitId]?.completed;
            state.logs[dateStr][habitId] = { completed: !current };
            saveToStorage();
            renderTodayTab();
        }

        function renderAnalyticsTab() {
            renderHeatmap();
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmap-grid-container');
            container.innerHTML = '';
            for (let i = 89; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dStr = getTodayString(d);
                const count = state.logs[dStr] ? Object.values(state.logs[dStr]).filter(l => l.completed).length : 0;

                const cell = document.createElement('div');
                cell.className = `w-3 h-3 rounded-xs ${count > 0 ? 'bg-emerald-500' : 'bg-gray-100 dark:bg-neutral-800'} cursor-pointer`;
                cell.onclick = () => openDateZoomModal(dStr);
                container.appendChild(cell);
            }
        }

        function openDateZoomModal(dateStr) {
            document.getElementById('date-zoom-title').innerText = `Logs for ${dateStr}`;
            const content = document.getElementById('date-zoom-content');
            const dayLogs = state.logs[dateStr];
            if (!dayLogs || Object.keys(dayLogs).length === 0) {
                content.innerHTML = '<p>No check-ins logged for this date.</p>';
            } else {
                content.innerHTML = Object.keys(dayLogs).map(id => {
                    const h = state.habits.find(hab => hab.id === id);
                    return `<div class="p-2 rounded bg-gray-50 dark:bg-neutral-800">${h ? h.name : 'Habit'}: ${dayLogs[id].completed ? '✓ Completed' : 'Incomplete'}</div>`;
                }).join('');
            }
            document.getElementById('date-zoom-modal').classList.remove('hidden');
        }

        function closeDateZoomModal() { document.getElementById('date-zoom-modal').classList.add('hidden'); }

        function renderManageTab() {
            document.getElementById('manage-count').innerText = state.habits.length;
            document.getElementById('manage-habits-list').innerHTML = state.habits.map(h => `
                <div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-2xl p-4 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm">${h.name}</h4>
                        <span class="text-xs text-gray-500">${h.freq === 'weekly' ? `Quota: ${h.quota}x/week` : 'Daily'}</span>
                    </div>
                    <button onclick="deleteHabit('${h.id}')" class="text-red-500 text-sm"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function openHabitModal() { document.getElementById('habit-modal').classList.remove('hidden'); }
        function closeHabitModal() { document.getElementById('habit-modal').classList.add('hidden'); }

        function handleHabitSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('habit-name').value.trim();
            const freq = document.getElementById('habit-freq').value;
            const quota = parseInt(document.getElementById('habit-quota').value) || 1;
            state.habits.push({ id: 'h_' + Date.now(), name, freq, quota, color: '#0a84ff' });
            saveToStorage();
            closeHabitModal();
            renderApp();
        }

        function deleteHabit(id) {
            state.habits = state.habits.filter(h => h.id !== id);
            saveToStorage();
            renderApp();
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `habit_tracker_backup_${getTodayString()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
    </script>
</body>
</html>
